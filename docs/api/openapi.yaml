openapi: 3.1.0
info:
  title: Tagihan Vendra Sync API
  version: 0.6.0
  description: >-
    Kontrak sinkronisasi lokal. Push/pull memerlukan token perangkat.
    Bootstrap dan registry perangkat hanya tersedia pada listener admin
    localhost port 8788 dengan token admin terpisah. Kedua listener HTTP tetap
    loopback. HTTPS pairing tersedia opt-in pada IP private/loopback tertentu.
servers:
  - url: http://127.0.0.1:8787
    description: Service lokal Fedora
  - url: https://127.0.0.1:8789
    description: HTTPS opt-in; tidak berjalan jika pairing belum diaktifkan
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Memeriksa kesiapan service dan database hub
      responses:
        '200':
          description: Service dan database siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database hub tidak tersedia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sync/bootstrap:
    servers:
      - url: http://127.0.0.1:8788
        description: Kontrol admin localhost
    post:
      security:
        - AdminToken: []
      operationId: bootstrapHub
      summary: Mengisi hub kosong dengan snapshot awal dari Fedora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
            example:
              protocol_version: 1
              bootstrap_id: 0199e7d0-0000-7000-8000-000000000030
              device_id: 0199e7d0-0000-7000-8000-000000000001
              bills:
                - id: 0199e7d0-0000-7000-8000-000000000003
                  name: Spotify
                  category: Hiburan
                  amount_minor_units: 59990
                  currency: IDR
                  billing_cycle: monthly
                  next_due_date: '2026-10-25'
                  start_date: '2026-01-25'
                  status: active
                  notes: null
                  created_at: '2026-10-01T00:00:00Z'
                  updated_at: '2026-10-01T00:00:00Z'
                  deleted_at: null
                  version: 1
              payments: []
              created_at: '2026-10-17T00:00:00Z'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Snapshot diterima atau retry dikenali sebagai duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
              example:
                protocol_version: 1
                bootstrap_id: 0199e7d0-0000-7000-8000-000000000030
                status: accepted
                server_sequences: [1]
        '400':
          description: Snapshot atau request tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '409':
          description: Protocol berbeda atau hub sudah berisi data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '415':
          description: Content-Type bukan application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '503':
          description: Hub tidak dapat menyimpan snapshot secara durable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
  /v1/sync/push:
    post:
      security:
        - DeviceToken: []
      operationId: pushChanges
      summary: Mengirim maksimal 100 operation lokal ke sync hub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
            example:
              protocol_version: 1
              device_id: 0199e7d0-0000-7000-8000-000000000001
              operations:
                - operation_id: 0199e7d0-0000-7000-8000-000000000002
                  entity_type: bill
                  entity_id: 0199e7d0-0000-7000-8000-000000000003
                  operation_type: bill.create
                  base_version: 0
                  payload:
                    id: 0199e7d0-0000-7000-8000-000000000003
                    name: Spotify
                    category: Hiburan
                    amount_minor_units: 59990
                    currency: IDR
                    billing_cycle: monthly
                    next_due_date: '2026-10-25'
                    start_date: '2026-01-25'
                    status: active
                    notes: null
                    created_at: '2026-10-17T00:00:00Z'
                    updated_at: '2026-10-17T00:00:00Z'
                    deleted_at: null
                    version: 1
                  created_at: '2026-10-17T00:00:00Z'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: device_id pada body tidak sesuai identitas credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '200':
          description: Batch diproses; periksa status setiap operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
              example:
                protocol_version: 1
                results:
                  - operation_id: 0199e7d0-0000-7000-8000-000000000002
                    status: accepted
                    server_sequences: [1]
        '400':
          description: Request, device ID, atau JSON tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '409':
          description: Protocol version tidak didukung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '413':
          description: Batch atau request terlalu besar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '415':
          description: Content-Type bukan application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '503':
          description: Hub tidak dapat memproses batch secara durable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
  /v1/sync/pull:
    get:
      security:
        - DeviceToken: []
      operationId: pullChanges
      summary: Mengambil perubahan hub setelah cursor tertentu
      parameters:
        - name: after
          in: query
          required: true
          description: Server sequence terakhir yang sudah diterapkan client.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Jumlah maksimal perubahan dalam satu halaman.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Halaman perubahan terurut berdasarkan server sequence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
              example:
                protocol_version: 1
                changes:
                  - server_sequence: 1
                    operation_id: 0199e7d0-0000-7000-8000-000000000002
                    entity_type: bill
                    entity_id: 0199e7d0-0000-7000-8000-000000000003
                    version: 1
                    payload:
                      id: 0199e7d0-0000-7000-8000-000000000003
                      name: Spotify
                      category: Hiburan
                      amount_minor_units: 59990
                      currency: IDR
                      billing_cycle: monthly
                      next_due_date: '2026-10-25'
                      start_date: '2026-01-25'
                      status: active
                      notes: null
                      created_at: '2026-10-17T00:00:00Z'
                      updated_at: '2026-10-17T00:00:00Z'
                      deleted_at: null
                      version: 1
                    created_at: '2026-10-17T00:00:00Z'
                next_cursor: 1
                has_more: false
        '400':
          description: Cursor, limit, atau query tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '503':
          description: Hub tidak dapat membaca change log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
  /v1/admin/devices:
    servers:
      - url: http://127.0.0.1:8788
    get:
      operationId: listDevices
      summary: Membaca metadata perangkat termasuk status revoked
      security:
        - AdminToken: []
      responses:
        '200':
          description: Daftar perangkat; tidak berisi token atau hash credential
          content:
            application/json:
              schema:
                type: object
                required: [protocol_version, devices]
                properties:
                  protocol_version:
                    const: 1
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/DeviceStorageUnavailable'
    post:
      operationId: registerLocalDevice
      summary: Mendaftarkan credential melalui kontrol admin tepercaya
      description: >-
        Token dibuat client dan disimpan di secure storage terlebih dahulu.
        Retry dengan ID, nama, dan token sama mengembalikan 200.
        ID/token berbeda atau credential revoked tidak ditimpa dan menghasilkan 409.
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol_version, device_id, name, credential]
              properties:
                protocol_version:
                  type: integer
                  const: 1
                device_id:
                  $ref: '#/components/schemas/UUIDv7'
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Nama di-trim dan tidak boleh mengandung control character.
                credential:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: '^[A-Za-z0-9_-]{43}$'
                  writeOnly: true
                  description: Encoding base64url canonical tanpa padding dari 32 byte random kriptografis.
      responses:
        '201':
          $ref: '#/components/responses/DeviceResult'
        '200':
          $ref: '#/components/responses/DeviceResult'
        '400':
          description: Identitas, nama, credential, atau JSON tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Protocol berbeda atau identitas/credential sudah dipakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '415':
          description: Content-Type bukan application/json
        '503':
          $ref: '#/components/responses/DeviceStorageUnavailable'
  /v1/admin/devices/{device_id}/revoke:
    servers:
      - url: http://127.0.0.1:8788
    post:
      operationId: revokeDevice
      summary: Mencabut akses perangkat tanpa menghapus data finansial
      security:
        - AdminToken: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/DeviceResult'
        '400':
          description: device_id tidak valid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Perangkat tidak terdaftar
        '503':
          $ref: '#/components/responses/DeviceStorageUnavailable'
  /v1/admin/pairing:
    servers:
      - url: http://127.0.0.1:8788
    get:
      operationId: getPairingOverview
      summary: Membaca kesiapan HTTPS dan request pairing tanpa token mentah
      security:
        - AdminToken: []
      responses:
        '200':
          description: Status pairing; enabled false jika listener belum diaktifkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/pairing/invitations:
    servers:
      - url: http://127.0.0.1:8788
    post:
      operationId: createPairingInvitation
      summary: Membuat undangan satu calon perangkat yang berlaku lima menit
      security:
        - AdminToken: []
      responses:
        '201':
          description: Undangan rahasia sementara; token tidak dapat dibaca ulang
          content:
            application/json:
              schema:
                type: object
                required: [protocol_version, invitation]
                properties:
                  protocol_version:
                    const: 1
                  invitation:
                    $ref: '#/components/schemas/PairingInvitation'
        '400':
          $ref: '#/components/responses/PairingFailure'
        '401':
          $ref: '#/components/responses/PairingFailure'
        '409':
          $ref: '#/components/responses/PairingFailure'
        '410':
          $ref: '#/components/responses/PairingFailure'
        '429':
          $ref: '#/components/responses/PairingFailure'
        '503':
          $ref: '#/components/responses/PairingFailure'
  /v1/admin/pairing/invitations/{invitation_id}/cancel:
    servers:
      - url: http://127.0.0.1:8788
    post:
      operationId: cancelPairingInvitation
      summary: Membatalkan undangan dan request pending terkait
      security:
        - AdminToken: []
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          description: Undangan dibatalkan
        '400':
          $ref: '#/components/responses/PairingFailure'
        '401':
          $ref: '#/components/responses/PairingFailure'
        '409':
          $ref: '#/components/responses/PairingFailure'
        '410':
          $ref: '#/components/responses/PairingFailure'
        '429':
          $ref: '#/components/responses/PairingFailure'
        '503':
          $ref: '#/components/responses/PairingFailure'
  /v1/admin/pairing/requests/{request_id}/approve:
    servers:
      - url: http://127.0.0.1:8788
    post:
      operationId: approvePairingRequest
      summary: Mengizinkan calon perangkat secara eksplisit
      security:
        - AdminToken: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/PairingResult'
        '400':
          $ref: '#/components/responses/PairingFailure'
        '401':
          $ref: '#/components/responses/PairingFailure'
        '409':
          $ref: '#/components/responses/PairingFailure'
        '410':
          $ref: '#/components/responses/PairingFailure'
        '429':
          $ref: '#/components/responses/PairingFailure'
        '503':
          $ref: '#/components/responses/PairingFailure'
  /v1/admin/pairing/requests/{request_id}/reject:
    servers:
      - url: http://127.0.0.1:8788
    post:
      operationId: rejectPairingRequest
      summary: Menolak calon perangkat secara eksplisit
      security:
        - AdminToken: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/PairingResult'
        '400':
          $ref: '#/components/responses/PairingFailure'
        '401':
          $ref: '#/components/responses/PairingFailure'
        '409':
          $ref: '#/components/responses/PairingFailure'
        '410':
          $ref: '#/components/responses/PairingFailure'
        '429':
          $ref: '#/components/responses/PairingFailure'
        '503':
          $ref: '#/components/responses/PairingFailure'
  /v1/pairing/requests:
    servers:
      - url: https://127.0.0.1:8789
        description: Listener HTTPS opt-in
    post:
      operationId: submitPairingRequest
      summary: Mengajukan perangkat dengan undangan; belum memberi akses sync
      security:
        - InvitationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingSubmitRequest'
      responses:
        '200':
          $ref: '#/components/responses/PairingResult'
        '400':
          $ref: '#/components/responses/PairingFailure'
        '401':
          $ref: '#/components/responses/PairingFailure'
        '409':
          $ref: '#/components/responses/PairingFailure'
        '410':
          $ref: '#/components/responses/PairingFailure'
        '429':
          $ref: '#/components/responses/PairingFailure'
        '503':
          $ref: '#/components/responses/PairingFailure'
  /v1/pairing/requests/{request_id}:
    servers:
      - url: https://127.0.0.1:8789
        description: Listener HTTPS opt-in
    get:
      operationId: getPairingRequestStatus
      summary: Memeriksa hasil dengan token perangkat pending milik request ini
      security:
        - PendingDeviceToken: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/PairingResult'
        '400':
          $ref: '#/components/responses/PairingFailure'
        '401':
          $ref: '#/components/responses/PairingFailure'
        '409':
          $ref: '#/components/responses/PairingFailure'
        '410':
          $ref: '#/components/responses/PairingFailure'
        '429':
          $ref: '#/components/responses/PairingFailure'
        '503':
          $ref: '#/components/responses/PairingFailure'
  /v1/pairing/identity:
    servers:
      - url: https://127.0.0.1:8789
        description: Listener HTTPS opt-in
    get:
      operationId: getApprovedPairingIdentity
      summary: Memverifikasi identitas hub dan credential approved setelah restart
      security:
        - DeviceToken: []
      responses:
        '200':
          description: Identitas hub dan perangkat yang terautentikasi
          content:
            application/json:
              schema:
                type: object
                required: [protocol_version, hub_id, device_id]
                properties:
                  protocol_version:
                    const: 1
                  hub_id:
                    $ref: '#/components/schemas/UUIDv7'
                  device_id:
                    $ref: '#/components/schemas/UUIDv7'
        '400':
          $ref: '#/components/responses/PairingFailure'
        '401':
          $ref: '#/components/responses/PairingFailure'
        '409':
          $ref: '#/components/responses/PairingFailure'
        '410':
          $ref: '#/components/responses/PairingFailure'
        '429':
          $ref: '#/components/responses/PairingFailure'
        '503':
          $ref: '#/components/responses/PairingFailure'
components:
  securitySchemes:
    InvitationToken:
      type: http
      scheme: bearer
      bearerFormat: Single-use invitation token
    PendingDeviceToken:
      type: http
      scheme: bearer
      bearerFormat: Device token bound to this pending request
    DeviceToken:
      type: http
      scheme: bearer
      bearerFormat: Base64url random 32-byte device token
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: Separate local admin token
  responses:
    PairingFailure:
      description: >-
        Error pairing. 400 invalid input; 401 credential salah; 409 request/ID
        sudah dipakai; 410 sesi berakhir; 429 rate limit; 503 storage/service gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    PairingResult:
      description: Snapshot request tanpa credential atau hash
      content:
        application/json:
          schema:
            type: object
            required: [protocol_version, request]
            properties:
              protocol_version:
                const: 1
              request:
                $ref: '#/components/schemas/PairingRequest'
    Unauthorized:
      description: Credential tidak ada, salah, atau akses perangkat dicabut
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    DeviceResult:
      description: Metadata perangkat yang sudah disimpan
      content:
        application/json:
          schema:
            type: object
            required: [protocol_version, device]
            properties:
              protocol_version:
                const: 1
              device:
                $ref: '#/components/schemas/Device'
    DeviceStorageUnavailable:
      description: Penyimpanan registry perangkat belum tersedia
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
  schemas:
    PairingInvitation:
      type: object
      additionalProperties: false
      required: [protocol_version, hub_id, endpoint, certificate_sha256, invitation_id, invitation_token, expires_at]
      properties:
        protocol_version:
          const: 1
        hub_id:
          $ref: '#/components/schemas/UUIDv7'
        endpoint:
          type: string
          format: uri
          description: HTTPS pada IP private/loopback spesifik; bukan listener admin.
        certificate_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        invitation_id:
          $ref: '#/components/schemas/UUIDv7'
        invitation_token:
          type: string
          description: Rahasia sementara; jangan simpan pada koleksi atau log.
        expires_at:
          type: string
          format: date-time
    PairingSubmitRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, invitation_id, request_id, device_id, name, credential]
      properties:
        protocol_version:
          const: 1
        invitation_id:
          $ref: '#/components/schemas/UUIDv7'
        request_id:
          $ref: '#/components/schemas/UUIDv7'
        device_id:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
          minLength: 1
          maxLength: 80
        credential:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Token random 32 byte terpisah dari token undangan.
    PairingRequest:
      type: object
      additionalProperties: false
      required: [request_id, device_id, name, status, expires_at]
      properties:
        request_id:
          $ref: '#/components/schemas/UUIDv7'
        device_id:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
        status:
          type: string
          enum: [pending, approving, approved, rejected, expired, cancelled]
        expires_at:
          type: string
          format: date-time
    PairingOverview:
      type: object
      required: [protocol_version, info, requests]
      properties:
        active_invitation:
          type: [object, 'null']
          description: Metadata tanpa token; null setelah undangan dipakai atau berakhir.
          properties:
            invitation_id:
              $ref: '#/components/schemas/UUIDv7'
            expires_at:
              type: string
              format: date-time
        protocol_version:
          const: 1
        info:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
            hub_id:
              $ref: '#/components/schemas/UUIDv7'
            endpoint:
              type: string
              format: uri
            certificate_sha256:
              type: string
            certificate_pem:
              type: string
              description: Sertifikat publik; tidak pernah memuat private key.
        requests:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/PairingRequest'
    Device:
      type: object
      additionalProperties: false
      required: [device_id, name, created_at, revoked_at]
      properties:
        device_id:
          $ref: '#/components/schemas/UUIDv7'
        name:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - protocol_version
        - database_schema_version
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: tagihan-vendra-sync
        protocol_version:
          type: integer
          const: 1
        database_schema_version:
          type: integer
          minimum: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - error
      properties:
        status:
          type: string
          const: unavailable
        error:
          type: string
    PushRequest:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - device_id
        - operations
      properties:
        protocol_version:
          type: integer
          const: 1
        device_id:
          $ref: '#/components/schemas/UUIDv7'
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PushOperation'
    BootstrapRequest:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - bootstrap_id
        - device_id
        - bills
        - payments
        - created_at
      properties:
        protocol_version:
          type: integer
          const: 1
        bootstrap_id:
          $ref: '#/components/schemas/UUIDv7'
        device_id:
          $ref: '#/components/schemas/UUIDv7'
        bills:
          type: array
          description: Semua snapshot Bill lokal, termasuk archived dan tombstone.
          items:
            type: object
        payments:
          type: array
          description: Semua snapshot Payment historis tanpa side effect recurring.
          items:
            type: object
        created_at:
          type: string
          format: date-time
    BootstrapResponse:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - bootstrap_id
        - status
        - server_sequences
      properties:
        protocol_version:
          type: integer
          const: 1
        bootstrap_id:
          $ref: '#/components/schemas/UUIDv7'
        status:
          type: string
          enum: [accepted, duplicate]
        server_sequences:
          type: array
          items:
            type: integer
            minimum: 1
    PushOperation:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - entity_type
        - entity_id
        - operation_type
        - base_version
        - payload
        - created_at
      properties:
        operation_id:
          $ref: '#/components/schemas/UUIDv7'
        entity_type:
          type: string
          enum: [bill, payment]
        entity_id:
          $ref: '#/components/schemas/UUIDv7'
        operation_type:
          type: string
          enum: [bill.create, bill.update, bill.archive, payment.record]
        base_version:
          type: integer
          minimum: 0
        payload:
          type: object
          description: >-
            Snapshot Bill lengkap, atau object payment.record yang membawa
            snapshot Payment, snapshot Bill hasil, dan bill_base_version.
        created_at:
          type: string
          format: date-time
          description: Timestamp UTC untuk audit, bukan penentu urutan.
    PushResponse:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - results
      properties:
        protocol_version:
          type: integer
          const: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/PushResult'
    PushResult:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - status
        - server_sequences
      properties:
        operation_id:
          $ref: '#/components/schemas/UUIDv7'
        status:
          type: string
          enum: [accepted, duplicate, conflict, rejected]
        server_sequences:
          type: array
          description: >-
            Satu sequence untuk mutation biasa; payment.record dapat
            menghasilkan sequence Payment dan Bill.
          items:
            type: integer
            minimum: 1
        error_code:
          type: string
        entity_type:
          type: string
          enum: [bill, payment]
        entity_id:
          $ref: '#/components/schemas/UUIDv7'
        current_version:
          type: integer
          minimum: 0
    PullResponse:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - changes
        - next_cursor
        - has_more
      properties:
        protocol_version:
          type: integer
          const: 1
        changes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PullChange'
        next_cursor:
          type: integer
          minimum: 0
        has_more:
          type: boolean
    PullChange:
      type: object
      additionalProperties: false
      required:
        - server_sequence
        - operation_id
        - entity_type
        - entity_id
        - version
        - payload
        - created_at
      properties:
        server_sequence:
          type: integer
          minimum: 1
        operation_id:
          $ref: '#/components/schemas/UUIDv7'
        entity_type:
          type: string
          enum: [bill, payment]
        entity_id:
          $ref: '#/components/schemas/UUIDv7'
        version:
          type: integer
          minimum: 1
        payload:
          type: object
          description: Snapshot lengkap entity pada server sequence ini.
        created_at:
          type: string
          format: date-time
    APIErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    UUIDv7:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
